# nginx 會把 ${BACKEND_URL} 換成環境變數的值（官方映像檔的 templates 功能）
server {
  listen 80;
  root /usr/share/nginx/html;

  # 用 Docker 內建的 DNS，每次請求才查後端在哪裡：
  # 這樣後端還沒啟動（或改名）時，前端自己照樣能開，只有 /api 會回 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 跟後端講話：瀏覽器只認得同一個網址，nginx 幫忙轉給 backend，不用處理跨網域（CORS）
  location /api/ {
    set $backend ${BACKEND_URL};
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    # 帶上使用者的真實 IP（跟 deploy/nginx.conf 一樣）：後端用它限流、擋「同一人同時排兩份」，
    # 不帶的話所有人看起來都是前端容器，會共用同一個額度。直接覆蓋，不保留使用者自己帶的值（防假造）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # MCP（串流式 HTTP）：回應會拖很久（規劃約 1～3 分鐘），所以不能暫存、等待時間要拉長。
  # 不加結尾斜線、不改寫路徑：/mcp 和 /mcp/ 都原樣交給後端（後端會把 /mcp 轉到 /mcp/）
  # 用 regex 只接 /mcp 和 /mcp/…，不會吃到 /mcp-xxx 這種別的網址；proxy_pass 沒有帶路徑，所以原網址原樣轉給後端
  location ~ ^/mcp(/|$) {
    set $backend ${BACKEND_URL};
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    # 帶上使用者的真實 IP（跟 deploy/nginx.conf 一樣）：後端用它限流、擋「同一人同時排兩份」，
    # 不帶的話所有人看起來都是前端容器，會共用同一個額度。直接覆蓋，不保留使用者自己帶的值（防假造）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # 打包後的檔名帶雜湊值，可以放心長時間快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 單頁應用：/result、/plan/2 這些網址都交給 index.html，由前端路由處理
  location / {
    try_files $uri $uri/ /index.html;
  }
}
