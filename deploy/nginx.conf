# 反向代理（規格書 8.1）。api 開多個時，Docker DNS 會回傳全部的 IP，nginx 輪流分配。
upstream zerogap_api {
    server api:8000;
}

server {
    listen 80;
    client_max_body_size 64k;

    # /api 和 /mcp 都可能是串流：不緩衝；proxy_read_timeout 算的是兩次讀取之間，15 秒心跳夠用
    location ~ ^/(api|mcp)(/|$) {
        proxy_pass http://zerogap_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # nginx 預設不往外傳 X-Accel-*；要傳下去，前端容器的 nginx 才知道 SSE 不能緩衝（6.7）
        proxy_pass_header X-Accel-Buffering;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
