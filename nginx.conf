# nginx 會把 ${BACKEND_URL} 換成環境變數的值（官方映像檔的 templates 功能）
server {
  listen 80;
  root /usr/share/nginx/html;

  # 用 Docker 內建的 DNS，每次請求才查後端在哪裡：
  # 這樣後端還沒啟動（或改名）時，前端自己照樣能開，只有 /api 會回 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 跟後端講話：瀏覽器只認得同一個網址，nginx 幫忙轉給 backend，不用處理跨網域（CORS）
  location /api/ {
    set $backend ${BACKEND_URL};
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  # 打包後的檔名帶雜湊值，可以放心長時間快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 單頁應用：/result、/plan/2 這些網址都交給 index.html，由前端路由處理
  location / {
    try_files $uri $uri/ /index.html;
  }
}
