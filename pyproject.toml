[project]
name = "zerogap-backend"
version = "0.1.0"
description = "ZeroGap 零空檔：電影＋餐廳＋交通的行程規劃後端"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "rq==2.12.*",
    "httpx>=0.27",
    "tzdata",  # Windows 沒有內建時區資料（Asia/Taipei）
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要 PostgreSQL、Redis（docker compose）",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
